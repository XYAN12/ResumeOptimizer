services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com/v1}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-chat}
      RESUME_OPTIMIZER_DEBUG: "false"
      RESUME_OPTIMIZER_CORS_ORIGINS: '["http://localhost:5173","http://localhost:3000","http://localhost:8080"]'
      RESUME_OPTIMIZER_EXPORT_DIR: /tmp/resume-optimizer-exports
    ports:
      - "${BACKEND_PORT:-8000}:8000"

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    depends_on:
      - backend
